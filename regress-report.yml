bugreports:
  - summary: |
      Кривая вёрстка, если в поле каталога остаётся только 1 товар
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      - В строке поиска ввести "cal" - по результату фильтрации останется 1 товар: "Calvin Klein CK One"
    expected-result: |
      Вёрстка страницы будет отображаться корректно
    actual-result: |
      Вёрстка страницы "едет": чрезмерно удлиняется строка поиска

  - summary: |
      Неправильно работает поиск: в результатах лишнее
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      - В строке поиска ввести "cl"
    expected-result: |
      В списке товаров останутся только те товары, в названии (и, возможно, в описании) которых есть "cl"
    actual-result: |
      В списке разные товары, на страницах которых нет строки "cl"

  - summary: |
      Неправильно работает поиск: в результатах нет необходимого
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      - В строке поиска ввести "cl"
    expected-result: |
      В списке товаров останутся только те товары, в названии (и, возможно, в описании) которых есть "cl"
    actual-result: |
      В списке разные товары, на страницах которых нет строки "cl"

  - summary: |
      В значениях фильтра по категориям есть пустая строка, а по смыслу там должно быть "Все" или "Любая" [категория]
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      - На любой странице каталога открыть фильтр по категории
    expected-result: |
      В списке значений осмысленные названия для каждой категории
    actual-result: |
      В списке значений среди прочих есть пустое значение - сразу непонятно, что оно значит. А по смыслу должно называться "Все" или "Любая"

  - summary: |
      Не работет фильтр по наличию товара
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      - На первой странице каталога выключить значение "В наличии"
    expected-result: |
      На странице не останется ни одного товара, так как у всех товаров на первой странице количество доступных единиц больше 0
    actual-result: |
      На странице остаются все товары

  - summary: |
      Фильтрация по ценам работает не с ценами со скидкой, а с изначальными ценами - это неудобно
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Зайти на страницу каталога
      2. Задать фильтр по ценам
    expected-result: |
      На странице останутся товары, цены которых СО СКДИКОЙ соответствуют фильтрам - так пользователь видит, что реально может купить на заданный бюджет
    actual-result: |
      На странице остаются товары, цены которых БЕЗ СКДИКИ соответствуют фильтрам - в этом нет смысла и удобства для пользователя

  - summary: |
      В каталоге на карточке товара кликабельна только картинка, а должна быть кликабельна вся карточка
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Зайти на страницу каталога
      2. Навести курсор на описание товара на карточке любого товара
    expected-result: |
      Курсор станет поинтером (рукой с вытянутым указательным пальцем) -- то есть покажет, что элемент кликабелен
    actual-result: |
      Курсор становится текстовыделителем -- то есть объект под ним некликабельный

  - summary: |
      Вёрстка товаров в корзине не выровнена
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Добавить в корзину несколько разных товаров - минимум 2
      2. Перейти в корзину
    expected-result: |
      В строках товаров кнопки "Удалить" и другие информационные элементы будут изображены ровно в столбик, друг под другом
    actual-result: |
      В каждой строке товаров кнопки "Удалить" и другие информационные элементы расположены по-разному: они не образуют столбики

  - summary: |
      При оформлении заказа запрос на сервер возвращает ошибку 500
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Зайти на страницу каталога
      2. Добавить в корзину произвольное количество товаров
      3. Перейти в корзину, нажав кнопку Cart
      4. В корзине нажать кнопку Checkout (Оформить заказ)
    expected-result: |
      На сервер отправится запрос об оформлении заказа и будет получен корректный ответ
    actual-result: |
      Запрос на сервер возвращает ошибку 500

  - summary: |
      Листание страниц работает непонятно
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Зайти на страницу каталога
      2. Нажать кнопку Next
    expected-result: |
      Либо откроется следующая страница каталога с товарами с такими же категориями, либо у кнопки Next будет подписано, что дальше будут товары из других категорий
    actual-result: |
      Открывается страница каталога с совершенно другими категориями товаров: по каталогу непонятно, что при листании должно произойти именно это - не подписано, что на следующем листе будут другие категории

  - summary: |
      На каждой странице каталога доступны разные категории и бренды
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Зайти на страницу каталога
    expected-result: |
      В боковом меню слева в разделах Категории и Бренды доступны все категории и бренды, доступные на сайте
    actual-result: |
      В боковом меню слева в разделах Категории и Бренды доступны разные категории и бренды в зависимости от страницы

  - summary: |
      Не работают фильтры по бренду и цене одновременно
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Зайти на страницу каталога
      2. Задать фильтр по бренду
      3. Задать фильтр по цене (или можно поменять шаги 2 и 3 местами)
    expected-result: |
      В каталоге останутся только товары, соответствующие обоим заданным условиям
    actual-result: |
      В каталоге остаются как будто все товары - или по крайней мере много из них, и ни один не соответствует условиям фильтрации

  - summary: |
      Не работают фильтры по бренду и по категории
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Зайти на страницу каталога
      2. Задать фильтр по бренду
      3. Задать фильтр по категории, в которой нет бренда, заданного на шаге 2 (или можно поменять шаги 2 и 3 местами)
    expected-result: |
      В каталоге останутся только товары, соответствующие обоим заданным условиям
    actual-result: |
      В каталоге остаются как будто все товары - или по крайней мере много из них, и ни один не соответствует условиям фильтрации

  - summary: |
      Не работает фильтр по цене, если поставить "цена меньше 0"
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Зайти на страницу каталога
      2. Задать фильтр по цене: "меньше 0"
    expected-result: |
      В каталоге не останется ни одного товара
    actual-result: |
      В каталоге остаются как будто все товары - или по крайней мере много из них, и ни один не соответствует условиям фильтрации

  - summary: |
      В фильтр по цене можно ввести минус - это не имеет смысла
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Зайти на страницу каталога
      2. Задать фильтр по цене, использовав минус
    expected-result: |
      В фильтр по цене нельзя ввести минус - он не вводится так же, как остальные символы
    actual-result: |
      В фильтр по цене вводится минус

  - summary: |
      В корзине кнопка "Продолжить покупки" серая - как будто она недоступна
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Перейти на страницу корзины
    expected-result: |
      Кнопка "Продолжить покупки" будет выглядеть доступной для клика - то есть будет цвета, отличного от серого
    actual-result: |
      Кнопка "Продолжить покупки" серая, а этот цвет в дизайне принят для недоступных элементов. Это может путать пользователя

  - summary: |
      Кривая вёрстка при ширине окна меньше 768
    environment: |
      Яндекс Браузер 26.10.0.1854 (64-bit)
      ОС Windows 10 Корпоративная
      Версия	22H2
      Сборка ОС	19045.6456
    steps-to-reproduce: |
      1. Зайти на страницу каталога
      2. Изменить ширину экрана: выбрать любую меньше 768
    expected-result: |
      Сайт изменит размер и расположение элементов корректно, но всё ещё будет выглядеть ровно
    actual-result: |
      Пропали фильтры

  - summary: |
    В каталоге на карточке товара обрезана картинка
  environment: |
    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. Зайти на страницу каталога
  expected-result: |
    Картинки на карточках товаров будут видны полностью и в правильном масштабе, с верным соотношением сторон
  actual-result: |
    Картинки на карточках обрезаны
