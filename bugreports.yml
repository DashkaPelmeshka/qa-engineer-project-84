- summary: |
    При оформлении заказа запрос на сервер возвращает ошибку 500
  environment: |
    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. Зайти на страницу каталога
    2. Добавить в корзину произвольное количество товаров
    3. Перейти в корзину
    4. В корзине нажать кнопку "Оформить заказ"
  expected-result: |
    На сервер отправится запрос об оформлении заказа и будет получен корректный ответ
  actual-result: |
    Запрос на сервер возвращает ошибку 500 (см. скриншот assets/v1/v1_сервер_500.png)

- summary: |
    В окне сообщения об успешном оформлении заказа не работает кнопка "Крестик" в правом верхнем углу
  environment: |
    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. Зайти на страницу каталога
    2. Добавить в корзину произвольное количество товаров
    3. Перейти в корзину
    4. В корзине нажать кнопку "Оформить заказ"
    5. В появившемся окне нажать кнопку "Крестик" в правом верхнем углу окна
  expected-result: |
    Окно закроется (кнопка "Крестик" в правом верхнем углу работает для закрытия окна - это устоявшийся паттерн в дизайне)
  actual-result: |
    Окно не закрывается, кнопка не нажимается (см. скриншот assets/v1/v1_корзина_крестик.png)

- summary: |
    В окне сообщения об успешном оформлении заказа кнопка "Закрыть" в правом нижнем углу серая - как будто она недоступна
  environment: |
