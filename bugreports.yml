---
- summary: |
    Некорректная русская локализация
  environment: |
    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. Зайти на страницу каталога https://products-store.hexlet.app/
    2. Перевести язык сервиса на русский, нажав кнопку Language -> Russian
  expected-result: |
    На странице все тексты (кроме брендов) на русском языке
  actual-result: |
    Названия и описания товаров на английском

