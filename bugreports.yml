- summary: |
    Не загружается флаг для английскго языка
  environment: |
    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. Зайти на любую страницу сервиса https://products-store.hexlet.app/
    2. В правом верхнем углу нажать кнопку Language
  expected-result: |
    В появившемся меню языков для всех языков отображаются флаги
  actual-result: |
    Флаг для английского языка не отображается

- summary: |
    При оформлении заказа не отправляется запрос на сервер
  environment: |
    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. Зайти на страницу каталога https://products-store.hexlet.app/
    2. Добавить в корзину произвольное количество товаров
    3. Перейти в корзину, нажав кнопку Cart
    4. В корзине нажать кнопку Checkout (Оформить заказ)
  expected-result: |
    На сервер отправится запрос об оформлении заказа (во вкладке Network в DevTools будет запрос на сервер)
  actual-result: |
    Нет запроса на сервер об оформлении заказа

- summary: |
    В окне сообщения об успешном оформлении заказа не работает кнопка "Крестик" в правом верхнем углу
  environment: |
    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. Зайти на страницу каталога https://products-store.hexlet.app/
    2. Добавить в корзину произвольное количество товаров
    3. Перейти в корзину, нажав кнопку Cart
    4. В корзине нажать кнопку Checkout (Оформить заказ)
    5. В появившемся окне нажать кнопку "Крестик" в правом верхнем углу окна
  expected-result: |
    Окно закроется (кнопка "Крестик" в правом верхнем углу работает для закрытия окна - это устоявшийся паттерн в дизайне)
  actual-result: |
    Окно не закрывается, кнопка не нажимается

- summary: |
    В окне сообщения об успешном оформлении заказа кнопка "Закрыть" в правом нижнем углу серая - как будто она недоступна
  environment: |
    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. Зайти на страницу каталога https://products-store.hexlet.app/
    2. Добавить в корзину произвольное количество товаров
    3. Перейти в корзину, нажав кнопку Cart
    4. В корзине нажать кнопку Checkout (Оформить заказ)
  expected-result: |
    В появившемся окне кнопка "Закрыть" в правом нижнем углу или отсутствует (потому что уже есть кнопка "Крестик" в правом верхнем углу, которая закрывает окно), или имеет цвет, отличный от серого (так как серым обозначаются недоступные элементы)
  actual-result: |
    В появившемся окне кнопка "Закрыть" в правом нижнем углу серая - как будто она недоступна

- summary: |
    Кривая вёрстка при ширине окна меньше 992
  environment: |
    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. Зайти на страницу каталога https://products-store.hexlet.app/
    2. Изменить ширину экрана: выбрать любую меньше 992
  expected-result: |
    Сайт изменит размер и расположение элементов корректно, но всё ещё будет выглядеть ровно
  actual-result: |
    Вёрстка элементов "съезжает": картинки растягиваются, строка поиска шире боковой левой панели, фильтр цены выглядит непонятно
