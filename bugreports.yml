    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. На любой странице сервиса перевести язык сервиса на русский, нажав кнопку Language -> Russian
