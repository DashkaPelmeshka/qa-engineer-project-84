- summary: |
    В корзине некорректно представлена информация о товарах
  environment: |
    Яндекс Браузер 26.10.0.1854 (64-bit)
    ОС Windows 10 Корпоративная
    Версия	22H2
    Сборка ОС	19045.6456
  steps-to-reproduce: |
    1. Добавить в корзину несколько товаров
    2. Перейти на страницу корзины
  expected-result: |
    На странице корзины о каждом добавленном товаре будут указаны: название, итоговая цена за единицу, добавленное количество единиц товара, суммарная цена за все единицы этого товара
