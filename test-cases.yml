- summary: |
    Успешный поиск товаров по ключевому слову (в пределах первой страницы)
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    Строка для поиска - "calvin"
  steps:
    - В поле поиска ввести "calvin"
  expected-result: |
    В списке товаров останется только один товар с названием "Calvin Klein CK One"

