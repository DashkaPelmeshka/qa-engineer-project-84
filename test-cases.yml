- summary: |
    Успешная фильтрация товаров по бренду
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    В фильтре "Brand" - пункт "Essence"
  steps:
    - В фильтре в разделе "Brand" выбрать категорию "Essence"
  expected-result: |
    В списке товаров остается 1 товар - Essence Mascara Lash Princess

- summary: |
    Успешная фильтрация товаров по признаку наличия
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    В фильтре "In Stock" галочка снята
  steps:
    - В фильтрах в разделе "In Stock" снять галочку с пункта "In Stock"
    - Три раза нажать кнопку "Next"
  expected-result: |
    - В списке товаров остается 1 товар - Sportbike Motorcycle (тот, у которого в поле "Количество" указано 0)
    - На трёх предыдущих страницах товаров не остаётся, есть сообщение "Nothing found!", так как в поле "Количество" у всех товаров на 1-ой, 2-ой и 3-ей странице ненулевые значения

- summary: |
    Успешная фильтрация товаров по цене
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    В фильтре "Price" введены значения "From": 1, "To": 2
  steps:
    - В фильтре "Price" ввести значения "From": 1, "To": 2
  expected-result: |
    - В списке товаров остались 3 товара: Apple, Cucumber, Green Bell Pepper (их цены между 1 и 2$)

- summary: |
    Успешный просмотр информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    Любой товар
  steps:
    - В списке товаров выбрать любой: нажать на его карточку - откроется страница с описанием товара
  expected-result: |
    - На странице отображены: категория, название, рейтинг, цена без скидки, цена со скидкой, размер скидки, количество товаров, описание

- summary: |
    Успешное добавление товара в корзину из каталога
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    Любой товар
  steps:
    - В списке товаров выбрать любой: нажать на его карточку - откроется страница с описанием товара
    - На странице товара нажать на кнопку "Add to cart" несколько раз: меньше или равно количеству товара
  expected-result: |
    - У число в индексе корзины увеличилось на количество добавленных товаров
    - Если открыть корзину (нажать "Cart"), в списке будут отображён добавленный товар с корректным указанием добавленного количества


    

    
