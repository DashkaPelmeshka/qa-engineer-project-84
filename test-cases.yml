---
- summary: |
    Успешный поиск товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    Строка для поиска - "calvin"
  steps:
    - В поле поиска ввести "calvin"
  expected-result: |
    В списке товаров останется только один товар с названием "Calvin Klein CK One"

- summary: |
    Неуспешный поиск товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    Строка для поиска - "cl"
  steps:
    - В поле поиска ввести "cl"
  expected-result: |
    В списке товаров не останется ни одного товара, появится сообщение "Nothing found!"

- summary: |
    Успешный поиск товаров по категории
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    В фильтре "Category" - пункт "beauty"
  steps:
    - В фильтрах в выпадающем списке "Category" выбрать категорию "beauty"
  expected-result: |
    В списке товаров останутся 5 товаров, относящихся к этой категории: Essence Mascara Lash Princess, Eyeshadow Palette with Mirror, Powder Canister, Red Lipstick, Red Nail Polish

- summary: |
    Успешная фильтрация товаров по бренду
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    В фильтре "Brand" - пункт "Essence"
  steps:
    - В фильтре в разделе "Brand" выбрать категорию "Essence"
  expected-result: |
    В списке товаров остается 1 товар - Essence Mascara Lash Princess

- summary: |
    Успешная фильтрация товаров по признаку наличия
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта страница со списком товаров, фильтры пустые, открыт самый первый раздел сайта (кнопка Next ни разу не нажата)
  test-data: |
    В фильтре "In Stock" галочка снята
  steps:
    - В фильтрах в разделе "In Stock" снять галочку с пункта "In Stock"
    - Три раза нажать кнопку "Next"
  expected-result: |
    - В списке товаров остается 1 товар - Sportbike Motorcycle (тот, у которого в поле "Количество" указано 0)
    - На трёх предыдущих страницах товаров не остаётся, есть сообщение "Nothing found!", так как в поле "Количество" у всех товаров на 1-ой, 2-ой и 3-ей странице ненулевые значения

